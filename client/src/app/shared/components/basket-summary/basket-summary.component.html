<ng-container *ngIf="items.length > 0">
    <div class="table-responsive">
        <table class="table basket-table mb-0">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th class="text-center">Quantity</th>
                    <th class="text-right">Total</th>
                    <th *ngIf="isBasket" class="text-center"></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of items">

                    <td>
                        <div class="product-cell">
                            <img [src]="item.pictureUrl" [alt]="item.productName" class="thumb">
                            <div class="product-text">
                                <a routerLink="/shop/{{item.id || item.productId}}" class="product-name">{{item.productName}}</a>
                                <span *ngIf="item.type" class="product-type">{{item.type}}</span>
                            </div>
                        </div>
                    </td>

                    <td class="align-middle">{{item.price | currency}}</td>

                    <td class="align-middle">
                        <div class="qty mx-auto" *ngIf="isBasket; else plainQty">
                            <button type="button" class="qty-btn" (click)="decrementItemQuantity(item)"
                                aria-label="Decrease quantity">
                                <i class="fa fa-minus"></i>
                            </button>
                            <span class="qty-value">{{item.quantity}}</span>
                            <button type="button" class="qty-btn" (click)="incrementItemQuantity(item)"
                                aria-label="Increase quantity">
                                <i class="fa fa-plus"></i>
                            </button>
                        </div>
                        <ng-template #plainQty>
                            <div class="text-center qty-plain">{{item.quantity}}</div>
                        </ng-template>
                    </td>

                    <td class="align-middle text-right line-total">
                        {{item.price * item.quantity | currency}}
                    </td>

                    <td *ngIf="isBasket" class="align-middle text-center">
                        <button type="button" class="remove-btn" (click)="removeBasketItem(item)"
                            aria-label="Remove item">
                            <i class="fa fa-trash"></i>
                        </button>
                    </td>

                </tr>
            </tbody>
        </table>
    </div>
</ng-container>
