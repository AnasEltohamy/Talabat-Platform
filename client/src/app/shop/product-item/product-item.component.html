<div class="product-card">

    <a class="product-image" routerLink="/shop/{{product.id}}">
        <img src="{{product.pictureUrl}}" alt="{{product.name}}">
    </a>

    <div class="product-body">
        <span class="product-meta">{{product.productBrand}} · {{product.productType}}</span>
        <a class="product-name" routerLink="/shop/{{product.id}}">{{product.name}}</a>
        <div class="product-price">{{product.price | currency}}</div>
    </div>

    <div class="product-actions">
        <button type="button" class="btn btn-outline-primary" routerLink="/shop/{{product.id}}">View</button>
        <button type="button" class="btn btn-primary" (click)="addItemToBasket()">
            <i class="fa fa-shopping-cart mr-1"></i> Add
        </button>
    </div>

</div>
