<header class="site-nav bg-white border-bottom shadow-sm">
    <div class="container nav-inner">

        <a routerLink="/" class="brand">
            <img src="/assets/images/logo.jpg" alt="Talabat" class="logo">
        </a>

        <nav class="nav-links">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
            <a routerLink="/shop" routerLinkActive="active">Shop</a>
        </nav>

        <div class="nav-actions">
            <a routerLink="/basket" class="cart-link" aria-label="Basket">
                <i class="fa fa-shopping-cart"></i>
                <ng-container *ngIf="(basket$ | async) as basket">
                    <span class="cart-no" *ngIf="basket.items.length > 0">{{basket.items.length}}</span>
                </ng-container>
            </a>

            <ng-container *ngIf="(currentUser$ | async) === null">
                <a routerLink="/account/login" class="btn btn-outline-primary">Login</a>
                <a routerLink="/account/register" class="btn btn-primary">Sign up</a>
            </ng-container>

            <ng-container *ngIf="(currentUser$ | async) as user">
                <div class="dropdown" dropdown>
                    <a class="user-toggle dropdown-toggle" dropdownToggle>
                        <i class="fa fa-user-circle"></i>{{user.displayName}}
                    </a>
                    <div class="dropdown-menu dropdown-menu-right" *dropdownMenu>
                        <a routerLink="/basket" class="dropdown-item">
                            <i class="fa fa-shopping-cart"></i> View Basket
                        </a>
                        <a routerLink="/orders" class="dropdown-item">
                            <i class="fa fa-history"></i> View Orders
                        </a>
                        <div class="dropdown-divider"></div>
                        <a (click)="logout()" class="dropdown-item">
                            <i class="fa fa-sign-out"></i> Logout
                        </a>
                    </div>
                </div>
            </ng-container>
        </div>

    </div>
</header>
