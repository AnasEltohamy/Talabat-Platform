<div [formGroup]="checkoutForm">
    <h4 class="step-title">Delivery method</h4>
    <p class="step-subtitle">Choose how fast you want to receive your order.</p>

    <div class="methods" formGroupName="deliveryForm">
        <div class="method" *ngFor="let method of deliveryMethods">
            <input type="radio" id="dm-{{method.id}}" value="{{method.id}}"
                (click)="setShippingPrice(method)" formControlName="deliveryMethod">

            <label class="method-card" for="dm-{{method.id}}">
                <span class="method-radio"></span>
                <span class="method-info">
                    <strong class="method-name">{{method.shortName}}</strong>
                    <span class="method-desc">{{method.description}}</span>
                    <span class="method-time" *ngIf="method.deliveryTime">
                        <i class="fa fa-clock-o mr-1"></i>{{method.deliveryTime}}
                    </span>
                </span>
                <span class="method-price">{{method.cost | currency}}</span>
            </label>
        </div>
    </div>
</div>

<div class="step-actions">
    <button type="button" class="btn btn-outline-primary" cdkStepperPrevious>
        <i class="fa fa-angle-left mr-2"></i>Back to address
    </button>
    <button type="button" [disabled]="checkoutForm.get('deliveryForm').invalid" class="btn btn-primary" cdkStepperNext>
        Go to review<i class="fa fa-angle-right ml-2"></i>
    </button>
</div>
