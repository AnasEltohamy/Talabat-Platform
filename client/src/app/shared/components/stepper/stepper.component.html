<div class="stepper">

    <ol class="steps">
        <li class="step" *ngFor="let step of steps; let i = index"
            [class.done]="i < selectedIndex"
            [class.active]="i === selectedIndex">

            <button type="button" class="step-btn" (click)="onClick(i)" [disabled]="i >= selectedIndex">
                <span class="step-circle">
                    <i *ngIf="i < selectedIndex; else stepNumber" class="fa fa-check"></i>
                    <ng-template #stepNumber>{{i + 1}}</ng-template>
                </span>
                <span class="step-label">{{step.label}}</span>
            </button>

        </li>
    </ol>

    <div class="step-content">
        <ng-container [ngTemplateOutlet]="selected.content"></ng-container>
    </div>

</div>
