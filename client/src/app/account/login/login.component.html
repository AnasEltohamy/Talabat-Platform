<div class="auth-page">
    <div class="auth-card">

        <div class="auth-icon"><i class="fa fa-user"></i></div>
        <h2 class="auth-title">Welcome back</h2>
        <p class="auth-subtitle">Sign in to your account to continue shopping.</p>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <app-text-input formControlName="email" [label]="'Email address'"></app-text-input>
            <app-text-input formControlName="password" [label]="'Password'" [type]="'password'"></app-text-input>

            <button [disabled]="loginForm.invalid" class="btn btn-primary btn-block btn-auth" type="submit">
                Sign in
            </button>
        </form>

        <p class="auth-switch">
            New to Talabat?
            <a routerLink="/account/register">Create an account</a>
        </p>

    </div>
</div>
