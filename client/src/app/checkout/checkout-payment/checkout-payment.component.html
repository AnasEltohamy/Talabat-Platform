<div [formGroup]="checkoutForm">
    <h4 class="step-title">Payment</h4>
    <p class="step-subtitle">Enter your card details to complete the order.</p>

    <div class="row">
        <div class="col-12" formGroupName="paymentForm">
            <app-text-input [label]="'Name on card'" formControlName="nameOnCard"></app-text-input>
        </div>

        <div class="col-12 mb-3">
            <label class="field-label">Card number</label>
            <div #cardNumber class="form-control stripe-field"></div>
            <span class="text-danger small" *ngIf="cardErrors">{{cardErrors}}</span>
        </div>

        <div class="col-6 mb-3">
            <label class="field-label">Expiry date</label>
            <div #cardExpiry class="form-control stripe-field"></div>
        </div>

        <div class="col-6 mb-3">
            <label class="field-label">CVC</label>
            <div #cardCvc class="form-control stripe-field"></div>
        </div>
    </div>

    <div class="secure-note">
        <i class="fa fa-lock"></i> Payments are processed securely by Stripe.
    </div>
</div>

<div class="step-actions">
    <button type="button" class="btn btn-outline-primary" cdkStepperPrevious>
        <i class="fa fa-angle-left mr-2"></i>Back to review
    </button>
    <button type="button"
        [disabled]="loading
            || checkoutForm.get('paymentForm').invalid
            || !cardNumberValid
            || !cardExpiryValid
            || !cardCvcValid"
        class="btn btn-primary"
        (click)="submitOrder()">
        <i class="fa fa-lock mr-2"></i>Submit order
        <i *ngIf="loading" class="fa fa-spinner fa-spin ml-2"></i>
    </button>
</div>
