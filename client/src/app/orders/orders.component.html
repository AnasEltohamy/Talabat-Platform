<div class="container orders-page">

    <ng-container *ngIf="orders">

        <div class="panel" *ngIf="orders.length > 0; else noOrders">
            <div class="table-responsive">
                <table class="table orders-table mb-0">
                    <thead>
                        <tr>
                            <th>Order</th>
                            <th>Date</th>
                            <th class="text-center">Items</th>
                            <th class="text-right">Total</th>
                            <th class="text-center">Status</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let order of orders" routerLink="/orders/{{order.id}}">
                            <td><span class="order-no">#{{order.id | slice:0:8 | uppercase}}</span></td>
                            <td>{{order.orderDate | date:'medium'}}</td>
                            <td class="text-center">{{order.items?.length}}</td>
                            <td class="text-right total">{{order.total | currency}}</td>
                            <td class="text-center">
                                <span class="status"
                                    [ngClass]="{
                                        'pending': order.status === 'Pending',
                                        'paid': order.status === 'PaymentReceived',
                                        'failed': order.status === 'PaymentFailed'
                                    }">
                                    <ng-container [ngSwitch]="order.status">
                                        <ng-container *ngSwitchCase="'PaymentReceived'">Paid</ng-container>
                                        <ng-container *ngSwitchCase="'PaymentFailed'">Payment failed</ng-container>
                                        <ng-container *ngSwitchDefault>{{order.status}}</ng-container>
                                    </ng-container>
                                </span>
                            </td>
                            <td class="text-right chevron"><i class="fa fa-angle-right"></i></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <ng-template #noOrders>
            <div class="empty">
                <i class="fa fa-file-text-o"></i>
                <h4>No orders yet</h4>
                <p>When you place an order, it will show up here.</p>
                <a routerLink="/shop" class="btn btn-primary">Browse the shop</a>
            </div>
        </ng-template>

    </ng-container>

</div>
