<div class="container error-page">
    <div class="error-card">
        <div class="error-icon"><i class="fa fa-exclamation-triangle"></i></div>
        <h2 class="error-title">Something went wrong</h2>
        <p class="error-text">We hit an unexpected problem on our side. Please try again in a moment.</p>

        <div class="error-actions">
            <button type="button" class="btn btn-primary" (click)="reload()">
                <i class="fa fa-refresh mr-2"></i>Try again
            </button>
            <a routerLink="/" class="btn btn-outline-primary">
                <i class="fa fa-home mr-2"></i>Back to home
            </a>
        </div>

        <!-- تفاصيل للمطور -->
        <details class="dev-details" *ngIf="error">
            <summary>Technical details</summary>
            <p class="dev-message">{{error.message}}</p>
            <code *ngIf="error.details">{{error.details}}</code>
            <p class="dev-hint">
                Tip: open the browser dev tools ← Network, check the failing request, and reproduce it in Postman.
            </p>
        </details>
    </div>
</div>
