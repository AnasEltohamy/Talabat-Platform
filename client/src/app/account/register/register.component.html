<div class="auth-page">
    <div class="auth-card">

        <div class="auth-icon"><i class="fa fa-user-plus"></i></div>
        <h2 class="auth-title">Create your account</h2>
        <p class="auth-subtitle">Join Talabat and start ordering in minutes.</p>

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            <app-text-input formControlName="displayName" [label]="'Display Name'"></app-text-input>
            <app-text-input formControlName="email" [label]="'Email address'"></app-text-input>
            <app-text-input formControlName="password" [label]="'Password'" [type]="'password'"></app-text-input>

            <ul class="auth-errors" *ngIf="errors">
                <li *ngFor="let error of errors">
                    <i class="fa fa-exclamation-circle mr-2"></i>{{error}}
                </li>
            </ul>

            <button [disabled]="registerForm.invalid" class="btn btn-primary btn-block btn-auth" type="submit">
                Register
            </button>
        </form>

        <p class="auth-switch">
            Already have an account?
            <a routerLink="/account/login">Sign in</a>
        </p>

    </div>
</div>
