<div class="container shop-page">
    <div class="row">

        <!-- الفلاتر -->
        <aside class="col-lg-3 mb-4">
            <div class="filter-card" *ngIf="types && brands">

                <div class="filter-group">
                    <h6 class="filter-title">Sort by</h6>
                    <select class="custom-select" (change)="onSortSelected($event.target.value)">
                        <option *ngFor="let sort of sortOptions"
                            [selected]="shopParams.sort === sort.value"
                            [value]="sort.value">
                            {{sort.name}}
                        </option>
                    </select>
                </div>

                <div class="filter-group">
                    <h6 class="filter-title">Brands</h6>
                    <ul class="filter-list">
                        <li *ngFor="let brand of brands"
                            [class.active]="brand.id === shopParams.brandId"
                            (click)="onBrandSelected(brand.id)">
                            {{brand.name}}
                        </li>
                    </ul>
                </div>

                <div class="filter-group mb-0">
                    <h6 class="filter-title">Types</h6>
                    <ul class="filter-list">
                        <li *ngFor="let type of types"
                            [class.active]="type.id === shopParams.typeId"
                            (click)="onTypeSelected(type.id)">
                            {{type.name}}
                        </li>
                    </ul>
                </div>

            </div>
        </aside>

        <!-- المنتجات -->
        <section class="col-lg-9">

            <div class="toolbar">
                <app-paging-header [totalCount]="totalCount" [pageNumber]="shopParams.pageNumber"
                    [pageSize]="shopParams.pageSize"></app-paging-header>

                <div class="search-box" *ngIf="products">
                    <div class="input-group">
                        <input (keyup.enter)="onSearch()" type="text" class="form-control" #search
                            placeholder="Search products...">
                        <div class="input-group-append">
                            <button (click)="onSearch()" class="btn btn-primary" type="button">
                                <i class="fa fa-search"></i>
                            </button>
                            <button (click)="onReset()" class="btn btn-outline-secondary" type="button">Reset</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-sm-6 col-xl-4 mb-4 d-flex" *ngFor="let product of products">
                    <app-product-item [product]="product"></app-product-item>
                </div>
            </div>

            <div class="d-flex justify-content-center" *ngIf="totalCount > 0">
                <app-pager
                    [pageSize]="shopParams.pageSize"
                    [totalCount]="totalCount"
                    [pageNumber]="shopParams.pageNumber"
                    (pageChanged)="onPageChanged($event)">
                </app-pager>
            </div>

        </section>
    </div>
</div>
